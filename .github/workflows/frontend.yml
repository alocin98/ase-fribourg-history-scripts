name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - webapp/frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - webapp/frontend/**
      - .github/workflows/frontend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp/frontend

jobs:
  check:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint -- --format github

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Runs `npm run build` (tsc + vite) inside the production image.
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: webapp/frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
