services:
  ocr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ML_PORT:-8001}:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]
    restart: unless-stopped
